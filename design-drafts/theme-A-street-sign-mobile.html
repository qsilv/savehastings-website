<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:GoodDog;src:url(../public/fonts/GoodDog.woff2)}
*{box-sizing:border-box;margin:0}
body{background:#ff8a00;color:#14110f;font-family:Overpass,sans-serif;width:1440px}
.wrap{padding:28px}
.sign{border:6px solid #14110f;border-radius:36px;padding:14px;}
.inner{border:3px solid #14110f;border-radius:24px;padding:36px 48px 56px;position:relative}
nav{display:flex;align-items:center;gap:36px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:17px}
nav img{height:44px}
nav .sp{flex:1}
.plate{background:#14110f;color:#ff8a00;border-radius:12px;padding:16px 26px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;font-size:20px;display:inline-flex;gap:14px;align-items:center}
.plate.w{background:#fff;color:#14110f;border:4px solid #14110f}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:48px;margin-top:56px;align-items:end}
.wm{font-family:GoodDog;font-size:124px;line-height:.85}
h1{font-size:84px;line-height:.92;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin-top:26px}
p.lead{font-size:23px;line-height:1.45;max-width:560px;margin-top:26px;font-weight:600}
.cta{display:flex;gap:16px;margin-top:34px}
.blade{background:#fff;border:4px solid #14110f;border-radius:10px;display:inline-flex;align-items:center;font-weight:900;font-size:26px;letter-spacing:.06em;overflow:hidden}
.blade span{padding:10px 20px}.blade b{background:#14110f;color:#fff;padding:10px 16px;font-size:18px}
.photo{border:6px solid #14110f;border-radius:28px;overflow:hidden;height:600px;align-self:stretch}
.photo img{width:100%;height:100%;object-fit:cover}
.dist{background:#14110f;color:#fff;border-radius:36px;margin-top:28px;padding:40px 54px;display:grid;grid-template-columns:1fr 1fr;gap:0 80px}
.row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #3a332d;padding:20px 0;font-weight:800;text-transform:uppercase;font-size:24px;letter-spacing:.03em}
.row b{font-size:60px;font-weight:900;color:#ff8a00}

body{width:390px}.wrap{padding:10px}.sign{border-width:4px;border-radius:24px;padding:7px}.inner{border-width:2px;border-radius:17px;padding:18px 18px 26px}
nav img{height:34px}.hero{grid-template-columns:minmax(0,1fr);gap:22px;margin-top:26px}
.blade{font-size:17px;border-width:3px}.blade b{font-size:13px;padding:7px 10px}.blade span{padding:7px 12px}
.wm{font-size:45px;margin-top:18px!important}h1{font-size:44px;margin-top:12px}p.lead{font-size:17px;margin-top:16px}
.cta{flex-direction:column;gap:10px;margin-top:22px}.plate{justify-content:space-between;font-size:18px;padding:15px 20px}
.photo{height:300px;border-width:4px;border-radius:18px}
.dist{grid-template-columns:1fr;border-radius:24px;padding:14px 22px 22px;margin-top:12px}.row{font-size:15px;padding:14px 0;border-width:2px}.row b{font-size:36px}
</style></head><body><div class="wrap"><div class="sign"><div class="inner">
<nav><img src="../public/SaveHastingsBlack.png"><span class="sp"></span><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg></nav>
<div class="hero"><div>
<div class="blade"><b>E</b><span>HASTINGS ST</span></div>
<div class="wm" style="margin-top:28px">#SAVEHASTINGS</div>
<h1>Meals ahead.<br>Every 2 weeks.</h1>
<p class="lead">We're a youth-led group of volunteers who bring meals and supplies to people experiencing homelessness on East Hastings Street.</p>
<div class="cta"><span class="plate">Volunteer →</span><span class="plate w">Donate →</span></div>
</div><div class="photo"><img src="../public/hero/hero2.jpg"></div></div>
</div></div>
<div class="dist"><div><div class="row">Meals monthly <b>350+</b></div><div class="row">Active volunteers <b>200+</b></div></div><div><div class="row">People supported <b>8,000+</b></div><div class="row">Community partners <b>7+</b></div></div></div>
</div></body></html>
